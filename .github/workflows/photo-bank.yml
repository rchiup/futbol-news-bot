name: Warm photo bank
on:
  schedule:
    - cron: '13 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-news-engine
  cancel-in-progress: false
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python warm_photo_bank.py
      - name: Persist verified photo metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/photo_bank.json ] || [ -f data/photo_bank_cursor.json ]; then
            if [ -f data/photo_bank.json ]; then git add data/photo_bank.json; fi
            if [ -f data/photo_bank_cursor.json ]; then git add data/photo_bank_cursor.json; fi
            if ! git diff --cached --quiet; then
              git commit -m "Warm verified photo bank"
              git pull --rebase origin main
              git push
            fi
          fi
