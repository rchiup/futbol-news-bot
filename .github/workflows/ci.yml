name: Football Bot CI
on:
  push:
    paths-ignore:
      - 'data/**'
      - 'output/**'
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit tests (no paid APIs or publishing)
        run: python -m unittest discover -s tests -v
