name: Test Football V2 (report)
on:
  push:
    paths:
      - 'trigger/diagnose-now.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests and save diagnostic report
        id: test
        continue-on-error: true
        run: python diagnose_v2.py
      - name: Verify four curated portrait downloads (read-only, no Instagram)
        id: photos
        continue-on-error: true
        run: python photo_probe.py
      - name: Upload licensed proof graphics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-proof-graphics
          path: output/photo-proof/*-graphic.jpg
          if-no-files-found: ignore
          retention-days: 3
      - name: Commit redacted report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/health_v2.json data/photo_diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m "Record football V2 test health"
            for attempt in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME:-main}" &&
              git push && break
              if [ "$attempt" -eq 4 ]; then
                echo "Could not persist diagnostics after concurrent commits"
                exit 1
              fi
              sleep 4
            done
          fi
      - name: Fail if tests failed
        if: steps.test.outcome != 'success'
        run: exit 1
