name: Verify Football Photo Coverage
on:
  push:
    paths:
      - 'trigger/photo-now.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-photos
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe Wikidata and Commons image availability without publishing
        run: python photo_probe.py
      - name: Save safe diagnostic results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/photo_diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m "Report available licensed football portraits"
            git push
          fi
