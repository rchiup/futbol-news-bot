name: Compare Free Sports News LLMs
on:
  push:
    paths:
      - 'trigger/benchmark-llms-now.txt'
  workflow_dispatch:
  schedule:
    - cron: "56 22 * * *"
    - cron: "3,18,33,48 * * * *"
permissions:
  contents: write
jobs:
  watchdog:
    if: github.ref_name == 'main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: check
        name: Check last completed publisher heartbeat
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          try:
              with open('data/engine_status.json') as f:
                  status = json.load(f)
              checked = datetime.fromisoformat(status['checked_at_utc'].replace('Z', '+00:00'))
              age = (datetime.now(timezone.utc) - checked).total_seconds() / 60
          except (OSError, ValueError, KeyError, TypeError):
              age = 10000
          stale = age >= 20
          print(f'Publisher heartbeat age: {age:.1f} minutes; recovery needed: {stale}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('stale=' + str(stale).lower() + '\n')
          PY
  recover-publisher:
    needs: watchdog
    if: needs.watchdog.outputs.stale == 'true'
    uses: ./.github/workflows/collect.yml
    secrets: inherit
  benchmark:
    if: github.event_name != 'schedule' || github.event.schedule == '56 22 * * *'
    concurrency:
      group: football-news-engine
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (no live API requests)
        run: python -m unittest discover -s tests -v
      - name: Compare configured FREE models on exactly one real story
        run: python benchmark_free_llms.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'false' }}
          CEREBRAS_FREE_TIER_CONFIRMED: ${{ vars.CEREBRAS_FREE_TIER_CONFIRMED || 'false' }}
          FREE_LLM_ORDER: 'groq,gemini,cerebras,openrouter'
      - name: Persist redacted benchmark and usage
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in data/llm_benchmark.json data/llm_benchmark_history.json data/llm_ranking.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if [ -f data/llm_free_usage.json ]; then git add data/llm_free_usage.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Record fair free-only LLM sports-news benchmark"
            git stash push -u --keep-index -m "Temporary untracked benchmark outputs" || true
            for attempt in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep 4
            done
          fi
