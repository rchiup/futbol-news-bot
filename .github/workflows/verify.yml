name: Verify Instagram Publishing Integrations
on:
  push:
    paths:
      - 'trigger/verify-now.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check Instagram account and signed media hosting (no Instagram posts)
        id: check
        continue-on-error: true
        run: python integration_check.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          EXPECTED_IG_USERNAME: 'chaofelicevich'
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          META_AUTH_MODE: facebook
          META_GRAPH_VERSION: v27.0
      - name: Save redacted integration results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/integration_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Instagram integration verification"
            git push
          fi
      - name: Mark integration failure
        if: steps.check.outcome != 'success'
        run: exit 1
