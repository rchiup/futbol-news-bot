name: Football News Engine
on:
  push:
    paths:
      - 'trigger/run-now.txt'
  workflow_dispatch:
  workflow_call:
  repository_dispatch:
    types: [football-news-tick]
  schedule:
    # Shift off GitHub Actions top-of-quarter peaks; schedule can still be delayed.
    - cron: "11,26,41,56 * * * *"
permissions:
  contents: write
concurrency:
  group: football-news-engine
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Cache local cutout model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2netp-v1
      - name: Install optional CPU photo cutout
        continue-on-error: true
        run: pip install 'rembg[cpu]>=2.0.66,<3'
      - name: Cache Spanish voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chao-piper
          key: piper-es-MX-ald-medium-v1
      - name: Install free local Reel rendering tools
        continue-on-error: true
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          pip install 'piper-tts>=1.3,<2' 'edge-tts>=7.2,<8'
          mkdir -p ~/.cache/chao-piper
          cd ~/.cache/chao-piper
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_MX/ald/medium
          for file in es_MX-ald-medium.onnx es_MX-ald-medium.onnx.json; do
            if [ ! -s "$file" ]; then
              curl --fail --location --retry 2 --max-time 90 "$base/$file" -o "$file.tmp" && mv "$file.tmp" "$file" || exit 1
            fi
          done
      - name: Run automated tests and save a health report
        run: python diagnose_v2.py
      - name: Archive raw headlines (non-blocking, maximum 90s)
        run: timeout 90s python bot.py || echo "RSS archive unavailable; editorial engine continues"
      - name: Validate Meta account ID (never print secrets)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if ! [[ "$IG_USER_ID" =~ ^[0-9]{10,25}$ ]]; then
            echo "::error::IG_USER_ID must be the numeric Instagram account ID, not an access token. Fix GitHub Actions Secrets."
            exit 1
          fi
      - name: Curate and generate Instagram image previews
        run: python editorial.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          # EXCLUSIVELY free LLM providers. Paid OpenAI is not connected.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'true' }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_FREE_TIER_CONFIRMED: ${{ vars.CEREBRAS_FREE_TIER_CONFIRMED || 'false' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          CLOUDFLARE_FREE_TIER_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_TIER_CONFIRMED || 'true' }}
          NVIDIA_FREE_TIER_CONFIRMED: ${{ vars.NVIDIA_FREE_TIER_CONFIRMED || 'true' }}
          ZAI_FREE_TIER_CONFIRMED: ${{ vars.ZAI_FREE_TIER_CONFIRMED || 'true' }}
          FREE_LLM_ORDER: ${{ vars.FREE_LLM_ORDER || 'groq,gemini,openrouter,cloudflare,cerebras,nvidia,zai' }}
          ENABLE_REMBG: 'true'
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          BUFFER_YOUTUBE_CHANNEL_ID: "6b062ce18541f09ecb948793"
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ vars.BUFFER_TIKTOK_CHANNEL_ID }}
          ENABLE_REELS: ${{ vars.ENABLE_REELS || 'true' }}
          PIPER_MODEL: /home/runner/.cache/chao-piper/es_MX-ald-medium.onnx
          BRAND_NAME: ${{ vars.BRAND_NAME || 'CHAO FELICEVICH' }}
          ENABLE_SOURCE_BRIEF: 'true' # conservative Spanish source-attributed fallback when free AI is unavailable
          MAX_DRAFTS_PER_DAY: '180'
          MAX_DRAFTS_PER_RUN: '8'
          MORNING_POSTS_PER_RUN: ${{ vars.MORNING_POSTS_PER_RUN || '3' }}
          MORNING_MAX_POSTS: ${{ vars.MORNING_MAX_POSTS || '10' }}
          POST_SPACING_SECONDS: ${{ vars.POST_SPACING_SECONDS || '12' }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ENABLE_HF_IMAGE: 'false' # HF free accounts do not have free recurring image credits
          ENABLE_POLLINATIONS: 'false' # legacy anonymous endpoint is unreliable
          AI_IMAGE_PROVIDER_ORDER: 'cloudflare,pollinations,huggingface'
          ENABLE_AI_ART: 'false'
          AI_ART_MAX_PER_RUN: '2'
          AI_ART_MAX_DAILY: '24' # Free daily Cloudflare Neurons cap still applies
          MAX_POSTS_PER_DAY: '72'
          REQUIRE_PHOTO: 'false' # prefer verified photos; original editorial graphics are the safe fallback
          REQUIRE_SUBJECT_PHOTO: 'false'
          MAX_PER_SOURCE_6H: '6'
          MIN_PUBLISH_SCORE: ${{ vars.MIN_PUBLISH_SCORE || '24' }}
          ENABLE_PUBLISH: ${{ vars.ENABLE_PUBLISH || 'true' }}
          AUTO_APPROVE: ${{ vars.AUTO_APPROVE || 'true' }}
          EXPECTED_IG_USERNAME: 'chaofelicevich'
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          META_AUTH_MODE: 'facebook'
          META_GRAPH_VERSION: 'v27.0'
      - name: Upload preview images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-news-previews
          path: output/previews/*.jpg
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload reusable Reel MP4s
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-news-reels
          path: output/reels/*.mp4
          if-no-files-found: ignore
          retention-days: 7
      - name: Persist news and editorial queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/queue.json data/engine_status.json data/health_v2.json
          if [ -f data/photo_bank.json ]; then git add data/photo_bank.json; fi
          if [ -f data/llm_free_usage.json ]; then git add data/llm_free_usage.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh football headlines and editorial queue"
            git stash push -u --keep-index -m "Temporary editorial outputs" || true
            for attempt in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME:-main}" &&
              git push && break
              if [ "$attempt" -eq 4 ]; then
                echo "Failed to persist published media IDs after concurrent commits"
                exit 1
              fi
              sleep 4
            done
          fi
