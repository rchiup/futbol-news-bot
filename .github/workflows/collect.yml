name: Football News Engine
on:
  push:
    paths:
      - 'trigger/run-now.txt'
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: write
concurrency:
  group: football-news-engine
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run automated tests and save a health report
        run: python diagnose_v2.py
      - name: Archive raw headlines (non-blocking, maximum 90s)
        run: timeout 90s python bot.py || echo "RSS archive unavailable; editorial engine continues"
      - name: Validate Meta account ID (never print secrets)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if ! [[ "$IG_USER_ID" =~ ^[0-9]{10,25}$ ]]; then
            echo "::error::IG_USER_ID must be the numeric Instagram account ID, not an access token. Fix GitHub Actions Secrets."
            exit 1
          fi
      - name: Curate and generate Instagram image previews
        run: python editorial.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          # EXCLUSIVELY free LLM providers. Paid OpenAI is not connected.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'false' }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_FREE_TIER_CONFIRMED: ${{ vars.CEREBRAS_FREE_TIER_CONFIRMED || 'false' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FREE_LLM_ORDER: ${{ vars.FREE_LLM_ORDER || 'groq,gemini,cerebras,openrouter' }}
          BRAND_NAME: ${{ vars.BRAND_NAME || 'CHAO FELICEVICH' }}
          MAX_DRAFTS_PER_DAY: '75'
          MAX_DRAFTS_PER_RUN: '5'
          MORNING_POSTS_PER_RUN: ${{ vars.MORNING_POSTS_PER_RUN || '3' }}
          MORNING_MAX_POSTS: ${{ vars.MORNING_MAX_POSTS || '10' }}
          POST_SPACING_SECONDS: ${{ vars.POST_SPACING_SECONDS || '12' }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          ENABLE_AI_ART: 'true' # Explicit opt-in; usage-billed, max 2 per run and 6/day
          AI_ART_MAX_DAILY: '6' # Hard stop to limit paid generation
          MAX_POSTS_PER_DAY: '60'
          ENABLE_PUBLISH: ${{ vars.ENABLE_PUBLISH || 'true' }}
          AUTO_APPROVE: ${{ vars.AUTO_APPROVE || 'true' }}
          EXPECTED_IG_USERNAME: 'chaofelicevich'
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          META_AUTH_MODE: 'facebook'
          META_GRAPH_VERSION: 'v27.0'
      - name: Upload preview images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-news-previews
          path: output/previews/*.jpg
          if-no-files-found: ignore
          retention-days: 3
      - name: Persist news and editorial queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/queue.json data/engine_status.json data/health_v2.json
          if [ -f data/llm_free_usage.json ]; then git add data/llm_free_usage.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh football headlines and editorial queue"
            git stash push -u --keep-index -m "Temporary editorial outputs" || true
            for attempt in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME:-main}" &&
              git push && break
              if [ "$attempt" -eq 4 ]; then
                echo "Failed to persist published media IDs after concurrent commits"
                exit 1
              fi
              sleep 4
            done
          fi
