name: Football News Engine
on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"
permissions:
  contents: write
concurrency:
  group: football-news-engine
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Archive raw headlines
        run: python bot.py
      - name: Curate and generate Instagram image previews
        run: python editorial.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          BRAND_NAME: ${{ vars.BRAND_NAME || 'FÚTBOL AL DÍA' }}
          MAX_DRAFTS_PER_DAY: ${{ vars.MAX_DRAFTS_PER_DAY || '30' }}
          MAX_DRAFTS_PER_RUN: ${{ vars.MAX_DRAFTS_PER_RUN || '3' }}
          MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY || '30' }}
          ENABLE_PUBLISH: ${{ vars.ENABLE_PUBLISH || 'false' }}
          AUTO_APPROVE: ${{ vars.AUTO_APPROVE || 'false' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v24.0' }}
      - name: Upload preview images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-news-previews
          path: output/previews/*.jpg
          if-no-files-found: ignore
          retention-days: 3
      - name: Persist news and editorial queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh football headlines and editorial queue"
            git push
          fi
